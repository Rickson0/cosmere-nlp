intent_labels:
  - name: RAFO
    patterns:
      - "\\bRAFO\\b"
      - "RAFO'?d"
      - "RAFOs"
      - "Read And Find Out"
      - "read-and-find-out"
      - "read and find out"
      - "read to find out"
      - "you'?ll (have to |need to |gotta )?(just )?read (and|to|&) find out"
      - "we'?ll (have to |need to |gotta )?(just )?read (and|to|&) find out"
      - "you will have to (just )?read"
      - "wait and see"
      - "wait and read"
      - "wait for (the |a )?(next |future |later |upcoming )?(book|books|novel|series)"
      - "keep reading"
      - "(see|find out|learn) (it |that |this )?in (a |the )?(future|later|upcoming|next|another) (book|books|novel|series)"
      - "in (a )?future (book|books|novel|series)"
      - "(not yet|hasn'?t been|has not been|isn'?t yet) written"
      - "I'?m (going to|gonna) RAFO"
      - "I'?ll RAFO"
      - "that'?s a RAFO"
      - "(big|massive|huge) RAFO"
      - "all RAFO"
      - "would be telling" 
  - name: CONFIRMED
    patterns:
     - "^\\s*(yes|yep|yeah|yup|yiss)\\b"
     - "^\\s*(correct|exactly|precisely|indeed|affirmative)\\b"
     - "^\\s*(sure|of course|absolutely|certainly)\\s*[,.]"
     - "that'?s (right|correct|true|it)"
     - "that is (right|correct|true|it)"
     - "you (got|have) it"
     - "you'?re (right|correct)"
     - "you are (right|correct)"
     - "you nailed it"
     - "spot on"
     - "(I |we )?can confirm"
     - "(it|that|this) is canon"
     - "that'?s canon"
     - "(correct|right|exactly|indeed),? yes"
     - "yes,? (indeed|correct|exactly|right)"
     - "that'?s a yes"
     - "uh[- ]huh"
     - "mm[- ]hmm"
     - "not (incorrect|wrong|false)"  # ← NOVO
     - "won'?t say no" 
  - name: EVASIVE
    patterns:
      - "not going to answer"
      - "won'?t answer"
      - "can'?t answer"
      - "cannot answer"
      - "I won'?t (tell|say)"
